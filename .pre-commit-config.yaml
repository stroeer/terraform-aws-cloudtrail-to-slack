repos:
# Terraform
- repo: https://github.com/antonbabenko/pre-commit-terraform
  rev: v1.109.3
  hooks:
    - id: terraform_fmt
    - id: terraform_tflint
    - id: terraform_validate
    - id: terraform_docs
    - id: terraform_trivy
# Python
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.3
  hooks:
    - id: ruff-check
      args: [--exit-non-zero-on-fix]
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.3
  hooks:
    - id: codespell
      types_or: [python, markdown]
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.13.6
  hooks:
    - id: uv-lock
      args: [--project, src]
    - id: uv-export
      args: [--project, src, --no-dev, --no-emit-project, --frozen, -q, -o, src/deploy_requirements.txt]
