[project]
name = "terraform-aws-cloudtrail-to-slack"
version = "3.3.0"
description = "Parse AWS CloudTrail events and send alerts to Slack for events that match pre-configured rules"
authors = [{ name = "FivexL" }, { name = "Stroeer" }]
readme = "README.md"
# ponytail: keep in sync with the Lambda runtime in main.tf
requires-python = ">=3.13,<3.14"
dependencies = ["slack-sdk>=3.36"]

# boto3 ships with the Lambda runtime, so it is dev-only.
[dependency-groups]
dev = ["boto3", "pytest", "ruff"]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = [
  # pyflakes
  "F",
  # flake8-annotations
  "ANN",
  # flake8-unused-arguments
  "ARG",
  # pycodestyle
  "E", "W",
  # flake8-2020
  "YTT",
  # flake8-bugbear
  "B",
  # flake8-quotes
  "Q",
  # flake8-debugger
  "T10",
  # pylint
  "PLC", "PLE", "PLR", "PLW",
  # misc lints
  "PIE",
  # flake8-pyi
  "PYI",
  # tidy imports
  "TID",
  # implicit string concatenation
  "ISC",
  # type-checking imports
  "TCH",
  # comprehensions
  "C4",
  # pygrep-hooks
  "PGH"
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ISC004", "PGH003", "PLC0415"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.pyright]
reportGeneralTypeIssues = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = []
